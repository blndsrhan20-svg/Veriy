services:
  - type: web
    name: botnex
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botnex-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false
      - key: BOTNEX_DATA_DIR
        value: /var/data/bot_data
    disk:
      name: botnex-files
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: botnex-db
    plan: basic-256mb
    databaseName: botnex
    user: botnex
